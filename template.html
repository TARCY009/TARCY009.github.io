<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポケモンGO レイド火力チェッカー｜自分のポケモンのDPSを計算・比較</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/karyoku/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/karyoku/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/shadow-icon.css">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/explain.css">
<meta name="theme-color" content="#0b1023">
<!-- 保存してあるテーマを、画面を描く前に当てる(あとから当てるとダークが一瞬光る) -->
<script>try{if(localStorage.getItem('site_theme')==='light')document.documentElement.className='light';}catch(e){}</script>
<script>try{if(localStorage.getItem('site_explain')==='1')document.documentElement.classList.add('explain');}catch(e){}</script>
<style>
/* 色はすべてこの2つのブロックで決まる(画面の右上でダーク⇄ライトを切り替える)。
   既定は他ツール(/gbl/・/iv-checker/ 等)とそろえた濃紺のダーク。
   どちらのテーマでも、このツールの役割色は レイド=赤〜オレンジ ／ 自分=水色 ／ ランキング=紫 */
:root{
  --ink:#eef1fb; --sub:#8b96c2; --line:#2a3560;
  --accent:#5b8cff; --accent2:#43e0ff; --violet:#b06cff;
  --gold:#ffd54a; --goldbg:rgba(255,213,74,.13); --goldline:#7d6522; --goldbar:#c9a02c;
  --shadow:#b06cff; --special:#ff9750; --ng:#ff8a6b;
  --bgimg:
    radial-gradient(900px 520px at -10% -10%, rgba(67,224,255,.13), transparent 62%),
    radial-gradient(820px 540px at 112% 6%, rgba(176,108,255,.15), transparent 62%),
    radial-gradient(950px 620px at 50% 115%, rgba(255,120,80,.13), transparent 62%),
    linear-gradient(165deg,#0b1023 0%,#120f27 48%,#1a1024 100%);
  --panel:linear-gradient(180deg,rgba(26,35,66,.94),rgba(19,26,51,.94));
  --panelsh:0 18px 34px -20px var(--cardglow,rgba(91,140,255,.5)), 0 1px 0 rgba(255,255,255,.06) inset;
  --field:#0f1630; --fieldph:#6b76a3; --chip:#1a2342; --sugg:#161d38;
  --sugghover:linear-gradient(90deg,rgba(91,140,255,.18),rgba(176,108,255,.16));
  --tab:linear-gradient(180deg,#1e2850,#151d38); --tabsh:rgba(0,0,0,.4); --tabin:rgba(255,255,255,.06);
  --rowline:#232c4f; --barbg:#232c4f;
  --m1bg:linear-gradient(90deg,rgba(255,213,74,.16),rgba(255,213,74,.03)); --m1line:#8a6d1f; --m1ink:#ffd54a;
  --m2bg:linear-gradient(90deg,rgba(201,214,240,.14),rgba(201,214,240,.03)); --m2line:#4d5876; --m2ink:#c9d6f0;
  --m3bg:linear-gradient(90deg,rgba(224,149,91,.15),rgba(224,149,91,.03)); --m3line:#7a4f2e; --m3ink:#e0955b;
  /* 上位3件のメダル(タグの面と枠の光彩)。他ツールと同じ見せ方にそろえてある。
     --gold は文字色として別の役目があるので、メダル用の色は専用に持つ */
  --mgold:#f2c14e; --msilver:#c8d3de; --mbronze:#c98d5f;
  --ongold:#3a2c00; --onsilver:#232c34; --onbronze:#2e1c0d;
  --rkbg:#1a2342;   /* 4位以降のタグの面(カードの面と見分けが付く濃さにする) */
  --m1glow:rgba(242,193,78,.20); --m2glow:rgba(200,211,222,.16); --m3glow:rgba(201,141,95,.18);
  --lvbg:linear-gradient(90deg,rgba(67,224,255,.14),rgba(91,140,255,.08)); --lvline:#24506a;
  --lvebg:linear-gradient(90deg,rgba(255,107,129,.14),rgba(255,151,80,.07)); --lveline:#6b2b3a; --lveink:#ff9aa8;
  --delbg:#231532; --delline:#6b2b3a; --delink:#ff6b81; --delbg2:#301a3c; --delline2:#a13b52;
  --morebg:rgba(26,35,66,.6); --moreline:#4a3a7d; --morebg2:rgba(176,108,255,.12);
  --mainink:#062038; --disbg:#273154; --disink:#6b76a3;
  --mcS:#c396ff; --mcM:#f58fc2; --mcC:#5fd8ea; --smaxline:#5b3f8f; --smaxink:#c396ff;
  --helpbody:rgba(26,35,66,.9); --helpline:#4a3a7d;
  --ballsh:0 2px 8px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.22);
  --ballbtm:#e9edf8;
  --tbadge:inset 0 0 0 1px rgba(255,255,255,.16);
  --tcolor:#0b1023;   /* スマホのアドレスバーの色(theme.js が読む) */
}
:root.light{
  --ink:#20263a; --sub:#6a7391; --line:#dfe6f5;
  --accent:#3b6ef0; --accent2:#08b4c9; --violet:#8b5cf6;
  --gold:#b07a00; --goldbg:#fff6dd; --goldline:#f2c14e; --goldbar:#f2c14e;
  --shadow:#7a3cc4; --special:#d1490a; --ng:#c2410c;
  --bgimg:
    radial-gradient(900px 520px at -10% -10%, rgba(8,180,201,.20), transparent 62%),
    radial-gradient(820px 540px at 112% 6%, rgba(139,92,246,.18), transparent 62%),
    radial-gradient(950px 620px at 50% 115%, rgba(255,151,80,.17), transparent 62%),
    linear-gradient(165deg,#e9f1ff 0%,#efe9ff 48%,#fff0e4 100%);
  --panel:rgba(255,255,255,.92);
  --panelsh:0 14px 30px -16px var(--cardglow,rgba(59,110,240,.35)), 0 1px 0 rgba(255,255,255,.8) inset;
  --field:#fbfcff; --fieldph:#9aa3bd; --chip:#fff; --sugg:#fff;
  --sugghover:linear-gradient(90deg,#eef3ff,#f6f1ff);
  --tab:linear-gradient(180deg,#fff,#eff3fc); --tabsh:rgba(30,40,90,.13); --tabin:#fff;
  --rowline:#eceffa; --barbg:#e8ecf8;
  --m1bg:linear-gradient(90deg,#fff6d8,#fffdf3); --m1line:#f2c14e; --m1ink:#b07a00;
  --m2bg:linear-gradient(90deg,#eef2f9,#fafcff); --m2line:#c6d2e6; --m2ink:#64748f;
  --m3bg:linear-gradient(90deg,#fdeede,#fffaf4); --m3line:#e0b088; --m3ink:#a5652a;
  --mgold:#e0a800; --msilver:#9aa8b8; --mbronze:#c07f4a;
  --rkbg:#edf1f9;   /* カードの面が白なので、タグは薄いグレーにして面が見えるようにする */
  --m1glow:rgba(224,168,0,.20); --m2glow:rgba(120,140,165,.16); --m3glow:rgba(192,127,74,.18);
  --lvbg:linear-gradient(90deg,#eaf5ff,#f1f7ff); --lvline:#c9def7;
  --lvebg:linear-gradient(90deg,#fdeff0,#fdf4f0); --lveline:#efc2c7; --lveink:#a33;
  --delbg:#fff; --delline:#f0b8b8; --delink:#c33; --delbg2:#fff1f1; --delline2:#e08e8e;
  --morebg:#fbfaff; --moreline:#cfc6f0; --morebg2:#f6f2ff;
  --mainink:#fff; --disbg:#b9c6dd; --disink:#fff;
  --mcS:#7a3cc4; --mcM:#c02c76; --mcC:#0b7f92; --smaxline:#c4b0ea; --smaxink:#6d3fc4;
  --helpbody:rgba(255,255,255,.92); --helpline:#cfc6f0;
  --ballsh:0 2px 5px rgba(30,40,90,.35), inset 0 0 0 1px rgba(32,38,58,.55);
  --ballbtm:#ffffff;
  --tbadge:none;
  --tcolor:#e9f1ff;
}
/* 明るいバッジが白系背景に溶けるため極薄の縁取りを追加(ライトのときの該当4タイプのみ) */
:root.light .tbadge[title="でんき"],:root.light .tbadge[title="こおり"],
:root.light .tbadge[title="いわ"],:root.light .tbadge[title="じめん"]{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;color:var(--ink);line-height:1.55;padding:14px;min-height:100vh;
  background:var(--bgimg);
  background-attachment:fixed}
.wrap{max-width:860px;margin:0 auto}
header{margin:6px 0 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hmain{min-width:0}
.themesw{margin-top:2px}
/* 狭い画面はスイッチのぶんだけ幅が減るので、見出しを1行に収まる大きさまで下げる */
@media (max-width:430px){
  header h1{font-size:1.22rem}
  header p{font-size:.74rem}
}
header h1{font-size:1.42rem;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:.4em}
header h1::before{content:'';width:1em;height:1em;border-radius:50%;flex-shrink:0;
  background:
    radial-gradient(circle at center,#fff 0 17%,#20263a 17% 30%,transparent 30%),
    linear-gradient(180deg,#ff5470 0 44%,#20263a 44% 56%,var(--ballbtm) 56% 100%);
  box-shadow:var(--ballsh)}
/* 幅が足りないときは「ポケモンGO / レイド火力チェッカー」の切れ目で折り返す(語の途中で切らない) */
header h1{flex-wrap:wrap}
header h1 .brand,header h1 .tool{white-space:nowrap}
header h1 .tool{background:linear-gradient(92deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{font-size:.8rem;color:var(--sub);margin-top:3px}
/* overflow:hiddenにすると検索候補リストがカード外に出られず隠れるため使わない */
.card{position:relative;background:var(--panel);border:1px solid var(--cardline,var(--line));border-radius:16px;padding:20px 16px 16px;margin-bottom:16px;
  box-shadow:var(--panelsh)}
.card::before{content:'';position:absolute;left:0;top:0;right:0;height:4px;border-radius:15px 15px 0 0;background:var(--cardbar,linear-gradient(90deg,var(--accent),var(--accent2)))}
/* カードごとの役割色。上端のグラデーションバー(--cardbar)はどちらのテーマでも同じで、
   枠・光彩・入力欄の focus 色だけテーマに合わせて濃さを変える */
.c-boss{--cardline:#5a2b3d;--cardglow:rgba(255,84,112,.42);--cardbar:linear-gradient(90deg,#ff5470,#ff9750);--focusc:#ff7089;--focusring:rgba(255,84,112,.26)}
.c-my  {--cardline:#1f4a5e;--cardglow:rgba(67,224,255,.34);--cardbar:linear-gradient(90deg,#43e0ff,#5b8cff);--focusc:#43e0ff;--focusring:rgba(67,224,255,.24)}
.c-rank{--cardline:#3d2f68;--cardglow:rgba(176,108,255,.40);--cardbar:linear-gradient(90deg,#b06cff,#5b8cff);--focusc:#b06cff;--focusring:rgba(176,108,255,.26)}
:root.light .c-boss{--cardline:#ffd6dc;--cardglow:rgba(255,84,112,.32);--cardbar:linear-gradient(90deg,#ff5470,#ff9750);--focusc:#ff5470;--focusring:rgba(255,84,112,.16)}
:root.light .c-my  {--cardline:#c4e6ee;--cardglow:rgba(8,180,201,.30);--cardbar:linear-gradient(90deg,#08b4c9,#3b6ef0);--focusc:#08a6c9;--focusring:rgba(8,180,201,.16)}
:root.light .c-rank{--cardline:#ddd4fb;--cardglow:rgba(139,92,246,.32);--cardbar:linear-gradient(90deg,#8b5cf6,#3b6ef0);--focusc:#8b5cf6;--focusring:rgba(139,92,246,.16)}
.step{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.step b{background:var(--cardbar,var(--accent));color:#fff;border-radius:8px;padding:2px 10px;font-size:.75rem;letter-spacing:.06em;box-shadow:0 2px 6px -2px var(--cardglow,rgba(59,110,240,.5))}
.step h2{font-size:1rem}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;background:var(--field);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--fieldph)}
select option{background:var(--sugg);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--focusc,var(--accent));box-shadow:0 0 0 3px var(--focusring,rgba(91,140,255,.26))}
.sugg{position:relative}
.sugg-list{position:absolute;z-index:30;left:0;right:0;top:100%;background:var(--sugg);border:1px solid var(--cardline,var(--line));border-radius:12px;max-height:240px;overflow:auto;box-shadow:0 18px 36px rgba(0,0,0,.5);display:none}
.sugg-list div{padding:8px 12px;cursor:pointer;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
.sugg-list div:hover{background:var(--sugghover)}
.sugg-list small{color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.srow-meta{display:inline-flex;align-items:center;gap:5px}
.ng{color:var(--ng);font-weight:700}
.lowbulk{color:#ffd54a;background:#c2410c;border:1px solid #a33409;border-radius:6px;font-size:.62rem;font-weight:700;padding:0 5px;flex-shrink:0}
.srow-wrap{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.srow-main{display:flex;align-items:center;gap:6px}
.srow-cp{color:var(--sub);font-size:.7rem}
.bossmoves{margin-top:10px}
.bossmoves summary{cursor:pointer;color:var(--sub);font-weight:600;font-size:.8rem}
.bm-sec{margin-top:8px;font-size:.72rem;color:var(--sub);font-weight:700}
.bm-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.bm{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.8rem}
.bm-note{display:block;margin-top:6px;color:var(--sub);font-size:.68rem}
/* 暗い背景では あく等の暗いタイプが溶けるので、全タイプに極薄の白い縁取りを付ける
   (ライトのときは逆に明るいタイプが溶けるので、上の :root.light の指定で4タイプだけ暗い縁にする) */
.tbadge{box-shadow:var(--tbadge)}
.bossinfo{margin-top:12px;font-size:.85rem;color:var(--sub);font-weight:600}
/* 最低クリア人数(理論値): ランクは排他の選択なのでくっつけたタブ(.seg)。色はボスカードの赤 */
.tierrow{margin:6px 0 0}
/* 「スーパーメガ」は狭い画面で折り返す。語の途中(スーパ|ーメガ)で切れないよう<wbr>の位置だけ許す */
.tierrow .seg button{--mc:#ff8fa0;--mg:linear-gradient(160deg,#ff9d8a 0%,#ff5470 45%,#b91d3e 100%);--mgl:rgba(255,84,112,.42);word-break:keep-all}
.tierrow .seg button[aria-pressed="true"]{color:#fff}
:root.light .tierrow .seg button{--mc:#c22646}
.minppl{margin-top:8px;display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;font-size:.85rem}
.minppl .bignum{font-size:1.35rem}
.mp-sub{color:var(--sub);font-size:.74rem;font-weight:400}
/* 実戦シミュ(/raid/)への大きなボタン。別ページへ飛ぶことをレイドの赤〜紫のグラデーションで示す。
   立体+光彩+ホバーで持ち上がる、全ツール共通のデザイン言語に合わせた主役級ボタン */
.raidbtn{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 16px;text-decoration:none;
  flex:1 1 100%;max-width:480px;
  border-radius:14px;border:1px solid rgba(255,255,255,.14);position:relative;overflow:hidden;
  background:linear-gradient(115deg,#ff5470 0%,#e0447f 45%,#8b5cf6 100%);
  box-shadow:0 10px 26px -10px rgba(255,84,112,.55),0 6px 20px -8px rgba(139,92,246,.45),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .15s,box-shadow .15s,filter .15s}
.raidbtn:hover{transform:translateY(-2px);filter:brightness(1.06);
  box-shadow:0 14px 30px -10px rgba(255,84,112,.65),0 8px 24px -8px rgba(139,92,246,.55),inset 0 1px 0 rgba(255,255,255,.4)}
/* 斜めに走る光の帯(上品なひとすじ。動きを抑える設定では止まる) */
.raidbtn::after{content:'';position:absolute;top:-40%;bottom:-40%;left:-30%;width:34px;transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.30),transparent);animation:rbshine 3.2s ease-in-out infinite}
@keyframes rbshine{0%,55%{left:-20%}90%,100%{left:115%}}
@media (prefers-reduced-motion: reduce){.raidbtn::after{animation:none;display:none}}
.raidbtn .rbi{font-size:1.5rem;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));flex-shrink:0}
.raidbtn .rbtx{min-width:0}
.raidbtn .rbt{display:block;color:#fff;font-weight:800;font-size:1rem;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.raidbtn .rbs{display:block;color:rgba(255,255,255,.85);font-size:.7rem;margin-top:1px}
.raidbtn .rba{margin-left:auto;color:#fff;font-weight:800;font-size:1.1rem;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.3)}
:root.light .raidbtn{border-color:rgba(255,255,255,.5)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
label.f{font-size:.75rem;color:var(--sub);display:block;margin:10px 0 4px;font-weight:600}
.selrow{display:flex;align-items:center;gap:6px}
.selrow select{flex:1;min-width:0}
.seltype{flex-shrink:0;display:inline-flex}
.cprow input{max-width:220px}
.ivrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ivrow input{padding:8px 6px;text-align:center}
.ivrow label.f{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ivrow label.f.iv{margin:2px 0 4px;text-align:center}
.lv-out{margin-top:10px;font-size:.9rem;background:var(--lvbg);border:1px solid var(--lvline);border-radius:10px;padding:8px 12px;display:none}
.lv-out.err{background:var(--lvebg);border-color:var(--lveline);color:var(--lveink)}
/* ダークでは明るい水色〜青のグラデーションになるので、文字は白ではなく濃い色にして読みやすくする */
button.main{font:inherit;font-weight:800;background:linear-gradient(92deg,var(--focusc,var(--accent)),var(--accent));color:var(--mainink);border:none;border-radius:11px;padding:10px 24px;cursor:pointer;margin-top:14px;
  box-shadow:0 8px 18px -8px var(--cardglow,rgba(59,110,240,.6));transition:transform .15s,box-shadow .15s,filter .15s}
button.main:disabled{background:var(--disbg);color:var(--disink);box-shadow:none;cursor:not-allowed}
button.main:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 11px 22px -8px var(--cardglow,rgba(59,110,240,.7))}
button:focus-visible,.modes button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
/* 絞り込みタブ: 立体的に浮かせ、選択中はその役割の色のグラデーションで点灯する
   (全ツール共通のUIデザイン)。未選択でも文字色で役割の色を示すので、押す前から色で見分けられる */
.modes{display:flex;gap:6px;margin:2px 0 12px;flex-wrap:wrap}
.modes button{font:inherit;font-size:.8rem;font-weight:800;flex:0 1 auto;
  border:1px solid var(--line);background:var(--tab);border-radius:11px;padding:8px 12px;cursor:pointer;
  color:var(--mc,var(--sub));box-shadow:0 2px 0 var(--tabsh),inset 0 1px 0 var(--tabin);
  transition:transform .12s ease,box-shadow .12s ease,color .12s ease}
.modes button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 0 var(--tabsh),inset 0 1px 0 var(--tabin)}
.modes button[aria-pressed="true"]{color:#fff;border-color:transparent;transform:translateY(-1px);
  background:var(--mg);box-shadow:0 6px 18px var(--mgl),inset 0 1px 0 rgba(255,255,255,.5)}
.modes button:disabled{opacity:.35;cursor:default;box-shadow:none;transform:none}
/* 役割ごとの色: シャドウ=紫 ／ メガ・ゲンシ=マゼンタ(名前横のメガマークと同系) ／ シールド破壊=水色。
   未選択のときの文字色(--mc)は、暗い土台でも読めるよう明るめの同系色にする */
#fShadow{--mc:var(--mcS);--mg:linear-gradient(160deg,#c9a7ff 0%,#8b5cf6 45%,#6d28d9 100%);--mgl:rgba(139,92,246,.45);
  display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:0 1 auto;padding:8px 18px;font-size:.95rem}
#fMega{--mc:var(--mcM);--mg:linear-gradient(160deg,#f795c8 0%,#d63384 45%,#9c1a5e 100%);--mgl:rgba(214,51,132,.45)}
#mShield{--mc:var(--mcC);--mg:linear-gradient(160deg,#7fe6f5 0%,#08b4c9 45%,#06788a 100%);--mgl:rgba(8,180,201,.45)}
/* 水色は明るいので、点灯したときだけ文字を濃くする(紫・マゼンタは白のままで読める) */
#mShield[aria-pressed="true"],.seg button[aria-pressed="true"]{color:#042330}
/* 自分のポケモンの計算のしかた。排他の2択(今の状態/フル強化)はくっつけて1つのまとまりに見せ、
   独立ON/OFFのシャドウは離して置く(押したときの効き方の違いが並びで分かるように) */
.mymodes{margin:12px 0 0}
.seg{display:flex;gap:2px;flex:0 1 auto}
.seg button{flex:1 1 auto;--mc:var(--mcC);--mg:linear-gradient(160deg,#7fe6f5 0%,#08b4c9 45%,#0a6c9a 100%);--mgl:rgba(8,180,201,.42)}
.seg button:first-child{border-radius:11px 5px 5px 11px}
.seg button:last-child{border-radius:5px 11px 11px 5px}
#myShadow{--mc:var(--mcS);--mg:linear-gradient(160deg,#c9a7ff 0%,#8b5cf6 45%,#6d28d9 100%);--mgl:rgba(139,92,246,.45);
  display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:0 1 auto}
.mine-sum{position:relative;min-height:52px;background:linear-gradient(90deg,var(--goldbg),transparent);border:1px solid var(--goldline);border-left:5px solid var(--goldbar);border-radius:10px;padding:9px 62px 9px 12px;font-size:.85rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mine-sum b{color:var(--gold)}
.mine-sum .msiv{color:var(--sub);font-size:.72rem;white-space:nowrap;margin-left:5px}
/* 結論の数字(必要なPL・あと何回)は一段大きく出す */
.bignum{font-size:1.15rem;font-weight:800;letter-spacing:.02em}
.rmoves .bignum{font-size:.95rem}

.plctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* 狭い画面ではボタンが縦書きに潰れるので、行を分けて文字は折り返さない */
@media (max-width:560px){.plctl{flex-basis:100%}}
.plnow{font-size:1.15rem;font-weight:800;color:var(--gold);min-width:76px;text-align:center;letter-spacing:.02em}
.plbtn{border:1px solid var(--goldline);background:var(--tab);color:var(--gold);border-radius:9px;padding:4px 10px;font-size:.8rem;font-weight:800;cursor:pointer;line-height:1.5;white-space:nowrap;box-shadow:0 2px 0 var(--tabsh)}
.plbtn.up{background:linear-gradient(180deg,#ffd873,#f0a827);border-color:#d99a1c;color:#4a3200}
.plbtn.up:hover:not(:disabled){transform:translateY(-1px)}
.plbtn:disabled{opacity:.35;cursor:default;box-shadow:none;transform:none}
/* メガLv4(スーパーマックスレベル): 名前も挙動も /gbl/・/iv-checker/ と共通。役割の色はメガの紫 */
.plbtn.smax{border-color:var(--smaxline);color:var(--smaxink);font-size:.74rem;padding:4px 8px}
.plbtn.smax[aria-pressed="true"]{background:linear-gradient(160deg,#c9a7ff 0%,#8b5cf6 45%,#6d28d9 100%);border-color:#6d28d9;color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.4),inset 0 1px 0 rgba(255,255,255,.5);transform:translateY(-1px)}
.plneed{flex-basis:100%;font-size:.78rem;color:var(--gold);font-weight:700}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 7px;border-bottom:1px solid var(--rowline)}
/* 狭い画面では余白を削ってわざ名の行幅を稼ぐ(1行に収まる行が増えて一覧が見やすくなる) */
@media (max-width:560px){
  .card{padding:18px 11px 14px}
  .rank-row{padding:8px 3px;gap:7px}
  /* 順位のタグは狭い画面ほど詰める(幅を取るとわざ構成の折り返しが増えるため。3桁でも1行に収まる) */

  /* 狭い画面ではタブを横いっぱいに伸ばして押しやすくする(広い画面は内容ぶんの幅で左寄せ) */

/* 上位3行: 中の面は通常の行と同じにして、文字の読みやすさを落とさない(2026-08-20タダシさん指摘で
   「ぼやっとした光彩＋色の敷き」を廃止。にじむ光が視認性を下げていた)。
   メダル色は くっきりした枠線＋左端の帯(メダルと同じグラデーション) で示す。
   同じ火力が並ぶと1位が2行になることがあるので、並び位置(nth-child)ではなく順位の数字で色を決める */
#rankList .rank-row.md1,#rankList .rank-row.md2,#rankList .rank-row.md3{
  border-radius:12px;margin:3px 0;position:relative;overflow:hidden;padding-left:12px}
#rankList .rank-row.md1{border:1px solid var(--m1line);--mbar:linear-gradient(180deg,#ffe08a,var(--mgold) 55%,#c99a14)}
#rankList .rank-row.md2{border:1px solid var(--m2line);--mbar:linear-gradient(180deg,#f2f6fb,var(--msilver) 55%,#8f9dad)}

.rk{min-width:42px;text-align:center;font-weight:800;color:var(--sub);font-size:.8rem;line-height:1.3;flex-shrink:0;
  background:var(--rkbg);border-radius:8px;padding:4px 4px}
/* 上位3件のメダル。金・銀・銅とも同じ作り(明るい面＋その色の光彩) */
#rankList .rank-row.md1 .rk,#rankList .rank-row.md2 .rk,#rankList .rank-row.md3 .rk{box-shadow:0 4px 12px var(--mdsh),inset 0 1px 0 rgba(255,255,255,.5)}
#rankList .rank-row.md1 .rk{background:linear-gradient(160deg,#ffe08a 0%,var(--mgold) 55%,#c99a14 100%);color:var(--ongold);--mdsh:rgba(242,193,78,.35)}
#rankList .rank-row.md2 .rk{background:linear-gradient(160deg,#f2f6fb 0%,var(--msilver) 55%,#8f9dad 100%);color:var(--onsilver);--mdsh:rgba(200,211,222,.3)}

.sugg-list .srow{display:flex;align-items:center;gap:8px}
/* 取り消しは枠の右下に固定。押しやすいように大きめ(44px)にする */
.del{position:absolute;right:10px;bottom:8px;width:44px;height:34px;border:1px solid var(--delline);background:var(--delbg);color:var(--delink);cursor:pointer;font-size:1.15rem;font-weight:800;line-height:1;border-radius:9px;flex-shrink:0;padding:0}

.more{width:100%;margin-top:10px;font:inherit;font-size:.82rem;border:1px dashed var(--moreline);background:var(--morebg);border-radius:11px;padding:9px;cursor:pointer;color:var(--sub);transition:border-color .15s,background .15s,color .15s}
.more:hover{border-color:var(--violet);background:var(--morebg2);color:var(--ink)}
.note{font-size:.72rem;color:var(--sub);margin-top:10px}
/* 文字を減らすために画面から外した補足。消さずに隠しておき、

.expl{display:none}
.explain .expl{display:revert}   /* 行の途中に置く補足もあるので、元の表示種別へ戻す */
.empty{color:var(--sub);font-size:.85rem;text-align:center;padding:18px 0}
/* ページ最下部の「使い方」タブ。仕様・前提の説明はすべてここに集める(画面には結論だけ置く) */
.helpwrap{margin:2px 0 6px}

#helpbody{margin-top:8px;padding:16px 18px;background:var(--helpbody);border:1px solid var(--line);border-radius:14px}
#helpbody h4{margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--line,#2e3a47);font-size:.82rem;color:var(--violet)}
#helpbody h4:first-child{margin-top:0;padding-top:0;border-top:0}
#helpbody p,#helpbody li{font-size:.76rem;color:var(--sub,#93a3b3);line-height:1.9;margin:0 0 12px}

footer{font-size:.7rem;color:var(--sub);text-align:center;padding:14px 0 30px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
.enote{font-size:.72rem;color:var(--sub);line-height:1.75;margin:6px 2px 10px}

<script>
const D = __GODATA__;
const TI = {}; D.types.forEach((t,i)=>TI[t]=i);
const DEF_ENEMY = (100+15)*0.7903;
const KEYS = Object.keys(D.pokemon);

function eff(moveType, defTypes){ let m=1; for(const t of defTypes) m*=D.chart[moveType][TI[t]]; return m; }
function stab(p, mv){ return p.ty.includes(mv.t) ? 1.2 : 1.0; }
// def省略時はものさし防御(DEF_ENEMY)。最低クリア人数の計算だけ実際のボス防御を渡す
function dmg(p, mv, atkReal, bossTypes, shadow, def){
  return Math.floor(0.5*(atkReal/(def||DEF_ENEMY))*mv.p*stab(p,mv)*eff(mv.t,bossTypes)*(shadow?1.2:1)+1);
}
function comboDPS(p, m1, m2, atkReal, bossTypes, shadow, def){
  if(!m1.e || m1.e<=0 || !m2.e) return null;
  const d1=dmg(p,m1,atkReal,bossTypes,shadow,def), d2=dmg(p,m2,atkReal,bossTypes,shadow,def);
  const n2=(m1.e*100)/Math.abs(m2.e);
  const t=(m1.d*100)+(m2.d*n2);
  if(t<=0) return null;
  return {dps:(d1*100+d2*n2)/t, d1, d2};
}
function fastMoves(p){ return [...p.q.map(m=>({id:m,sp:false})), ...p.eq.map(m=>({id:m,sp:true}))].filter(x=>D.moves[x.id]); }
function chgMoves(p){ return [...p.c.map(m=>({id:m,sp:false})), ...p.ec.map(m=>({id:m,sp:true}))].filter(x=>D.moves[x.id]); }

// 全レベル(PL1〜51, 0.5刻み)の多数決で最適技構成を決定。
// 各レベルで1位が「ゲージ分割なし(1ゲージ技)」の場合、分割あり(2/3ゲージ)の最高構成との
// 火力差が7%未満なら分割ありをそのレベルの勝者とする(ドラゴン7%ルール)。
const LEVELS=[];
for(let l=1;l<=51;l+=0.5){ const m=D.cpm[String(l)]; if(m) LEVELS.push(m); }
function bestCombo(p, bossTypes, shadow){
  const fs=fastMoves(p).filter(x=>D.moves[x.id].e>0);
  const cs=chgMoves(p).filter(x=>D.moves[x.id].e<0);
  if(!fs.length||!cs.length) return null;
  // レベル非依存の係数を前計算: dmg = floor(coef*atk + 1)
  const coef={};
  for(const x of [...fs,...cs]){
    const mv=D.moves[x.id];
    coef[x.id]=0.5*mv.p*stab(p,mv)*eff(mv.t,bossTypes)*(shadow?1.2:1)/DEF_ENEMY;
  }
  const combos=[];
  for(const f of fs){ const m1=D.moves[f.id];
    for(const c of cs){ const m2=D.moves[c.id];
      const n2=(m1.e*100)/Math.abs(m2.e);
      const t=m1.d*100+m2.d*n2;
      if(t>0) combos.push({f,c,n2,t,split:Math.abs(m2.e)<100});
    }}
  if(!combos.length) return null;
  const tally=new Map();
  for(const m of LEVELS){
    const atk=(p.a+15)*m;
    let best=null,bestSplit=null;
    for(const cb of combos){
      const d1=Math.floor(coef[cb.f.id]*atk+1), d2=Math.floor(coef[cb.c.id]*atk+1);
      const v=(d1*100+d2*cb.n2)/cb.t;
      if(!best||v>best.v) best={v,cb};
      if(cb.split&&(!bestSplit||v>bestSplit.v)) bestSplit={v,cb};
    }
    let win=best;
    if(!best.cb.split && bestSplit && (best.v-bestSplit.v)/best.v<0.07) win=bestSplit;
    const key=win.cb.f.id+'|'+win.cb.c.id;
    tally.set(key,(tally.get(key)||0)+1);
  }
  // 最多得票（同数はPL50火力が高い方）
  const atk50=(p.a+15)*D.cpm['50'];
  let winner=null;
  for(const cb of combos){
    const key=cb.f.id+'|'+cb.c.id, votes=tally.get(key)||0;
    if(!votes) continue;
    const d1=Math.floor(coef[cb.f.id]*atk50+1), d2=Math.floor(coef[cb.c.id]*atk50+1);
    const dps=(d1*100+d2*cb.n2)/cb.t;
    if(!winner||votes>winner.votes||(votes===winner.votes&&dps>winner.dps))
      winner={votes,dps,f:cb.f,c:cb.c};
  }
  // めざめるパワーが最適の場合、同じ相性倍率(=同DPS)のタイプを全部集める(表示で複数アイコンにする)
  if(winner&&winner.f.id.startsWith('HIDDEN_POWER_')){
    const e0=eff(D.moves[winner.f.id].t,bossTypes);
    winner.hpTypes=fs.filter(x=>x.id.startsWith('HIDDEN_POWER_')&&eff(D.moves[x.id].t,bossTypes)===e0)
                    .map(x=>D.moves[x.id].t);
  }
  return winner;
}
function cpOf(p, iva, ivd, ivh, m){
  return Math.max(10, Math.floor((p.a+iva)*Math.sqrt(p.df+ivd)*Math.sqrt(p.h+ivh)*m*m/10));
}
function levelFromCP(p, cp, iva, ivd, ivh){
  const hits=[];
  for(let l=1;l<=51;l+=0.5){
    const m=D.cpm[String(l)]; if(!m) continue;
    if(cpOf(p,iva,ivd,ivh,m)===cp) hits.push(l);
  }
  return hits;
}

const toKata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
function attachSugg(inputEl, listEl, onPick, filterFn, rowFn){
  // IME変換の確定時に入力欄の値そのものをカタカナへ置き換える(変換中は触らない)
  inputEl.addEventListener('compositionend', ()=>{
    const v=toKata(inputEl.value);
    if(v!==inputEl.value) inputEl.value=v;
    inputEl.dispatchEvent(new Event('input'));
  });
  inputEl.addEventListener('input', e=>{
    if(!e.isComposing){
      const v=toKata(inputEl.value);
      if(v!==inputEl.value) inputEl.value=v;
    }
    const q=toKata(inputEl.value.trim());
    if(!q){listEl.style.display='none';return;}
    const res=KEYS.filter(k=>D.pokemon[k].n.includes(q) && (!filterFn||filterFn(k))).slice(0,12);
    if(!res.length){listEl.style.display='none';return;}
    listEl.innerHTML=res.map(k=>{
      const p=D.pokemon[k];
      const inner=rowFn?rowFn(p,k):`<span class="srow">${p.n}</span><small class="srow-meta">${typeIcons(p,18)}攻${p.a}</small>`;
      return `<div data-k="${k}">${inner}</div>`;
    }).join('');
    listEl.style.display='block';
    listEl.querySelectorAll('div').forEach(el=>el.onclick=()=>{listEl.style.display='none';inputEl.value=D.pokemon[el.dataset.k].n;onPick(el.dataset.k);});
  });
  document.addEventListener('click',e=>{if(!listEl.contains(e.target)&&e.target!==inputEl)listEl.style.display='none';});
}

// ボスのHPを「全員がランキング1位のアタッカー(PL50・個体値15・最適わざ)で制限時間いっぱい
// 攻撃し続けた」ときに倒しきれる最少の人数。データにレイドのランクは無いので、
// HP・制限時間・ボスのステータス補正(CPM)はランクのタブで切り替える
// ★2は存在しない。★4はメガレイド(2022-04-28にHP15000→9000)
const RAID_TIERS=[
  {id:'t1',label:'★1',hp:600,  time:180,cpm:0.5974,help:'★1レイド（HP600・制限時間180秒）として計算します'},
  {id:'t3',label:'★3',hp:3600, time:180,cpm:0.7300,help:'★3レイド（HP3600・制限時間180秒）として計算します'},
  {id:'t4',label:'★4',hp:9000, time:300,cpm:0.7903,help:'メガレイド（HP9000・制限時間300秒）として計算します'},
  {id:'t5',label:'★5',hp:15000,time:300,cpm:0.7903,help:'★5伝説レイド（HP15000・制限時間300秒）として計算します'},
  {id:'t6',label:'★6',hp:22500,time:300,cpm:0.7903,help:'メガ伝説・ゲンシカイキのレイド（HP22500・制限時間300秒）として計算します'},
  // スーパーメガレイドはゲーム内では★ではなくシールドの枚数でレベルが表示されるため「★7」とは書かない
  {id:'t7',label:'スーパー<wbr>メガ',hp:25000,time:300,cpm:0.7903,help:'スーパーメガレイド（HP25000・制限時間300秒）として計算します'},
];
let raidTier='t5';
// ボスからランクの見当を付ける。違うランクのときはタブで替えてもらう:
//   メガ伝説(メガレックウザ等)・ゲンシ → ★6 ／ ふつうのメガ → ★4 ／ それ以外 → ★5
// lg は伝説・幻の印(godata.json)。メガ・ゲンシは元のポケモンの分類を引き継いでいる
function guessTier(k){
  const p=D.pokemon[k];
  if(p.mega) return p.lg?'t6':'t4';
  return 't5';
}
// 1位アタッカーの候補: ものさし防御の火力順で上位8件だけ控えておき、
// ランクごとの実際のボス防御で計算し直して1位を選ぶ(防御は全わざ共通の係数なので順位はほぼ動かない)
let mpTopCache={boss:null,rows:null};
function mpTop(){
  if(mpTopCache.boss===boss) return mpTopCache.rows;
  const bt=D.pokemon[boss].ty, rows=[];
  for(const k of KEYS){
    const p=D.pokemon[k];
    if(!p.mega && !p.fe) continue;   // ランキングと同じ範囲(最終進化＋メガ)
    const b=bestCombo(p,bt,false);
    if(b) rows.push({p,f:b.f,c:b.c,shadow:false,dps:b.dps});
    if(p.shadow){
      const s=bestCombo(p,bt,true);
      if(s) rows.push({p,f:s.f,c:s.c,shadow:true,dps:s.dps});
    }
  }
  rows.sort((a,b)=>b.dps-a.dps);
  mpTopCache={boss,rows:rows.slice(0,8)};
  return mpTopCache.rows;
}
// スーパーメガレイドのシールド(暫定モデル・2026-08-28):
// 少人数の最低クリアは「シールドを壊さない前提」になる(壊す頭数が無い)ため、
// HP約80%でシールドが張られ、以後ずっとボス防御×SHIELD_DEFのまま削り切る、として計算する。
// SHIELD_DEF=4は海外攻略情報の値を安全側で暫定採用(実戦ログの逆算では3〜4倍・最有力3.6前後。
// メガフィナーレイベントで実測予定→確定したらここを直す)。展開タイミング80%も同じく暫定
const SHIELD_DEF=4, SHIELD_AT=0.8;
function mpCalc(tierId){
  const t=RAID_TIERS.find(x=>x.id===tierId), bp=D.pokemon[boss];
  const def=(bp.df+15)*t.cpm;   // ランク補正込みの実際のボス防御
  let best=null;
  for(const r of mpTop()){
    const atk=(r.p.a+15)*D.cpm['50'];
    const rn=comboDPS(r.p,D.moves[r.f.id],D.moves[r.c.id],atk,bp.ty,r.shadow,def);
    if(!rn) continue;
    if(t.id==='t7'){
      // 1人で削り切るのに必要な秒数 = シールド前(HPの20%) + シールド中(80%・防御4倍)
      const rs=comboDPS(r.p,D.moves[r.f.id],D.moves[r.c.id],atk,bp.ty,r.shadow,def*SHIELD_DEF);
      if(!rs) continue;
      const need=(1-SHIELD_AT)*t.hp/rn.dps + SHIELD_AT*t.hp/rs.dps;
      if(!best||need<best.need) best={...r,dps:rn.dps,sdps:rs.dps,need};
    }else if(!best||rn.dps>best.dps) best={...r,dps:rn.dps};
  }
  if(!best) return null;
  const n=t.id==='t7' ? Math.max(1,Math.ceil(best.need/t.time))
                      : Math.max(1,Math.ceil(t.hp/(best.dps*t.time)));
  return {t,best,n};
}

  seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===raidTier)));
  const r=mpCalc(raidTier);

  out.innerHTML=`<span title="${T_MP}">理論上 <b class="bignum">${r.n}人</b></span>
    <span class="mp-sub">全員が1位の ${badges(r.best.shadow,!!r.best.p.mega,r.best.p)}${r.best.p.n} で攻撃し続けた場合</span>

    ${r.t.id==='t7'?`<small class="mp-sub">※シールドを壊さない前提（シールド中はボス防御4倍・暫定値）<span class="expl">。HPが約80%になるとシールドが張られ、以後ずっと防御4倍のまま削り切る想定です。倍率は実測で確定したら更新します</span></small>`:''}

  }
}

// ---- 自分のポケモンの強化(PL+0.5) ----
// ゲーム内ではPLが表示されないため、「あと何回強化すれば届くか」をタップで数えられるようにする。
// 強化で上げられるのはPL50まで(最高の相棒でPL51)。
const PL_MAX=51, PL_NORM=50;   // PL50超(50.5・51)は最高の相棒でしか届かない
// メガLv4(スーパーマックスレベル)はPL上限+2、最高の相棒と合わせて53まで。
// ボタン名と挙動(再タップで解除)は /gbl/・/iv-checker/ と同じにそろえる
const plMaxOf=e=>e.maxLv||PL_MAX;
const ivTxt=e=>`個体値${(e.iva===e.ivd&&e.ivd===e.ivh)?e.iva:`${e.iva}/${e.ivd}/${e.ivh}`}`;
const mineLabel=e=>`PL${e.lv}・${ivTxt(e)}`;
function plCtlHtml(e,i){
  const mx=plMaxOf(e);
  // メガ・ゲンシだけスーパーマックスレベルのタブを出す
  const smax=D.pokemon[e.key].mega?`
    <button class="plbtn smax" data-i="${i}" data-max="52" aria-pressed="${mx===52}" title="メガLv4(スーパーマックスレベル)でPL上限+2(52まで)">メガLv4</button>
    <button class="plbtn smax" data-i="${i}" data-max="53" aria-pressed="${mx===53}" title="メガLv4+最高の相棒でPL上限53まで">メガLv4＋相棒</button>`:'';
  return `<span class="plctl">
    <button class="plbtn" data-i="${i}" data-d="-0.5" ${e.lv>1?'':'disabled'} title="1回ぶん戻す">−</button>
    <b class="plnow">PL ${e.lv}</b>
    <button class="plbtn up" data-i="${i}" data-d="0.5" ${e.lv<mx?'':'disabled'} title="1回強化する（+0.5）">強化 +0.5</button>
    ${e.lv!==e.lv0?`<button class="plbtn" data-i="${i}" data-rst="1" title="入力したPL${e.lv0}に戻す">↩</button>`:''}${smax}
  </span>`;
}
// 「あと◯回」= 目標PLまでの強化の回数(1回=0.5)
const plTimes=(from,to)=>Math.round((to-from)/0.5);
function bindMineCtl(sumEl){
  sumEl.querySelectorAll('.del').forEach(b=>b.onclick=()=>{mine.splice(+b.dataset.i,1);renderRank();});

      // (他ツールと同じ「上限52/53で評価」の状態になる)。再タップで解除し、元のPLへ戻す
      const v=+b.dataset.max;
      if(e.maxLv===v){ e.maxLv=PL_MAX; e.lv=Math.min(e.lvPre??e.lv,PL_MAX); e.lvPre=null; }
      else{ if(!e.maxLv) e.lvPre=e.lv; e.maxLv=v; e.lv=v; }
    }else{
      const nx=Math.min(plMaxOf(e),Math.max(1,e.lv+parseFloat(b.dataset.d)));
      if(!D.cpm[String(nx)]) return;
      e.lv=nx;
    }
    renderRank();
  });
}

// ---- 同じ火力は同順位（個体値チェッカーのSCPと同じ扱い）----
// 攻撃種族値・わざ・タイプ一致が同じなら火力もぴったり同じになる(対ドラゴンのオノノクスとレックウザなど)。
// 同じ数字なのに順位が別々になるのはおかしいので、同じ火力は同順位にして重なったぶんは次の順位を飛ばす。
// 計算の順序でごく小さい誤差が出ることがある(同じ344/7でも末尾がズレる)ので、相対1e-9までは同じ値とみなす。
const sameDps=(a,b)=>Math.abs(a-b)<=1e-9*Math.max(Math.abs(a),Math.abs(b),1);
// 火力の降順に並んだ配列へ順位(rk)を振る
function assignRanks(rows){
  let rk=0;
  rows.forEach((r,i)=>{ if(i===0||!sameDps(r.dps,rows[i-1].dps)) rk=i+1; r.rk=rk; });
  return rows;
}
// 一覧に無いもの(登録した自分のポケモン)の「◯位相当」。上と同じ基準なので一覧の順位と食い違わない
const rankIn=(rows,d)=>rows.filter(r=>r.dps>d&&!sameDps(r.dps,d)).length+1;

function buildRanking(){
  if(!boss) return [];
  const bt=D.pokemon[boss].ty, rows=[];
  for(const k of KEYS){
    const p=D.pokemon[k];
    if(p.mega && !fMega) continue;
    if(!p.mega && !p.fe) continue; // 進化前はランキングに表示しない(ボス選択・自分の登録では選択可)
    const base=bestCombo(p,bt,false);
    if(base) rows.push({k,p,shadow:false,...base});
    if(p.shadow && fShadow){
      const s=bestCombo(p,bt,true);
      if(s) rows.push({k,p,shadow:true,...s});
    }
  }
  rows.sort((a,b)=>b.dps-a.dps);
  return assignRanks(rows);
}
function mineRows(){
  if(!boss) return [];
  const bt=D.pokemon[boss].ty;
  return mine.map((e,i)=>{
    const p=D.pokemon[e.key];
    const atk=(p.a+e.iva)*D.cpm[String(e.lv)];
    const m1=D.moves[e.f], m2=D.moves[e.c];
    const r=comboDPS(p,m1,m2,atk,bt,e.shadow);
    return {i,e,p,dps:r?r.dps:0};
  });
}
function moveLabel(p, id, sp, hpTypes){
  const m=D.moves[id];
  const isSp = sp!==undefined?sp:(p.eq.includes(id)||p.ec.includes(id));
  // めざめるパワーは「（むし）」等のタイプ名テキストを出さず、
  // 最適タイプ(同DPSで複数あれば全部)のアイコンだけで示す
  if(id.startsWith('HIDDEN_POWER_')){
    const ts=(hpTypes&&hpTypes.length?hpTypes:[m.t]);
    const icons=ts.map(t=>typeIconHTML(D.typeJa[t],14)).join('');
    return icons+(isSp?`<span class="sp">めざめるパワー(特)</span>`:'めざめるパワー');
  }
  const nm = typeIconHTML(D.typeJa[m.t],14)+(isSp?`<span class="sp">${m.n}(特)</span>`:m.n);
  return nm;
}
function badges(shadow, mega, p){
  // ゲンシカイオーガ・ゲンシグラードンはメガシンカではなく「ゲンシ」なのでマークを分ける
  const mgLabel=(p&&/^ゲンシ/.test(p.n))?'ゲンシ':'メガ';
  const mgCls=mgLabel==='ゲンシ'?'tag-m2 tag-p2':'tag-m2';
  return (mega?`<span class="${mgCls}">${mgLabel}</span>`:'')+(shadow?'<span class="tag-s2" title="シャドウ"><i class="shadowmark"></i></span>':'');
}
// スーパーメガレイドのシールド破壊おすすめメガ:
// ①ボスの通常枠SPアタック(シールド中の攻撃1.8倍補正込み)をどれを受けても1発で倒れない(メガ=PL50個体値15、ボス=PL40想定)
// ②ゲージ2分割or3分割のSPアタックを持つ(シールド破壊が安定)
// ③その中で対ボスDPSが高い順
// ボスの通常枠SPアタックによる最大被ダメージ(シールド展開中の攻撃1.8倍補正込み)
// 2026-08-28実測で1.8倍に確定: メガリザードンY 100% PL50(CP5037・HP168)がシールド中メガエアームドの
// ゴッドバード1発で約61%減=ダメージ100〜105 → 補正1.73〜1.83 → 1.8(天候ブーストなし確認済み)。
// 旧2倍(2026-08-02のバー実測1.9〜2.2)は個体を特定しない粗い読みだったため置き換え
function shieldMaxHit(bp, p, def){
  const bossAtk=(bp.a+15)*D.cpm['40'];
  let maxHit=0, maxMove=null;
  for(const id of bp.c){
    const m=D.moves[id];
    if(!m||m.e>=0) continue;
    const dmg=Math.floor(0.5*m.p*(bossAtk*1.8/def)*stab(bp,m)*eff(m.t,p.ty))+1;
    if(dmg>maxHit){maxHit=dmg;maxMove=m;}
  }
  return {maxHit,maxMove};
}
function shieldRows(){
  if(!boss) return [];
  const bp=D.pokemon[boss], bt=bp.ty;
  const rows=[];
  for(const k of KEYS){
    const p=D.pokemon[k];
    if(!p.mega || p.n.startsWith('ゲンシ')) continue;
    const def=(p.df+15)*D.cpm['50'];
    const hp=Math.floor((p.h+15)*D.cpm['50']);
    const {maxHit,maxMove}=shieldMaxHit(bp,p,def);
    if(!maxMove || maxHit>=hp) continue;   // 1発で倒れる可能性があるメガは除外
    // 2/3分割SPアタック限定で対ボス最高DPS構成
    const fs=fastMoves(p).filter(x=>D.moves[x.id].e>0 && !x.id.startsWith('HIDDEN_POWER_'));
    const cs=chgMoves(p).filter(x=>{const m=D.moves[x.id];return m.e<0 && Math.abs(m.e)<100;});
    let best=null;
    const atk=(p.a+15)*D.cpm['50'];
    for(const f of fs){
      const m1=D.moves[f.id];
      for(const c of cs){
        const m2=D.moves[c.id];
        const r=comboDPS(p,m1,m2,atk,bt,false);
        if(r&&(!best||r.dps>best.dps)) best={f,c,dps:r.dps};
      }
    }
    if(!best) continue;
    rows.push({k,p,...best,hp,maxHit,maxMove});
  }
  rows.sort((a,b)=>b.dps-a.dps);
  return assignRanks(rows);
}
// 自分の登録メガをシールド破壊(メガ)の一覧に混ぜる。
// HPも防御もPLで変わるので、1発耐えられないときは「PLいくつから耐えるか」まで出す
// (登録わざで計算する。メガ以外・ゲンシはシールド破壊の対象外なので混ぜない)
function shieldMine(){
  if(!boss) return [];
  const bp=D.pokemon[boss], bt=bp.ty, out=[];
  mine.forEach((e,i)=>{
    const p=D.pokemon[e.key];
    if(!p.mega || p.n.startsWith('ゲンシ')) return;
    const m1=D.moves[e.f], m2=D.moves[e.c];
    const at=l=>{
      const c=D.cpm[String(l)];
      const def=(p.df+e.ivd)*c, hp=Math.floor((p.h+e.ivh)*c);
      const {maxHit,maxMove}=shieldMaxHit(bp,p,def);
      const r=comboDPS(p,m1,m2,(p.a+e.iva)*c,bt,e.shadow);
      return {lv:l,hp,maxHit,maxMove,dps:r?r.dps:0,hold:!maxMove||maxHit<hp};
    };
    const now=at(e.lv);
    let need=null;
    if(!now.hold){
      // HPは上がり被ダメは下がるので、耐えられる最小のPLを下から探す(メガLv4なら52・53まで)
      for(let l=1;l<=plMaxOf(e);l+=0.5){
        if(l<=e.lv||!D.cpm[String(l)]) continue;
        const s=at(l); if(s.hold){need=s;break;}
      }
    }
    out.push({i,e,p,...now,need,bars:Math.round(100/Math.abs(m2.e))});
  });
  return out;
}
function renderShieldRank(){
  const listEl=document.getElementById('rankList'), sumEl=document.getElementById('mineSummary'), moreBtn=document.getElementById('moreBtn');
  sumEl.innerHTML='';
  if(!boss){listEl.innerHTML='<div class="empty">ボスを選ぶと、シールド破壊に向いたメガを表示します</div>';moreBtn.style.display='none';return;}
  const rows=shieldRows();
  const my=shieldMine();
  const rankOf=d=>rankIn(rows,d);
  // 自分のメガの概要(1発耐えるか / 耐えないなら「あと何回強化すれば耐えるか」)
  const skipped=mine.length-my.length;
  sumEl.innerHTML=my.map(m=>{
    const right=m.hold
      ? `🛡1発耐え　火力 <b>${m.dps.toFixed(2)}</b> ＝ <b>${rankOf(m.dps)}位相当</b>`
      : (m.need
        ? `<span class="ng">🛡1発アウト</span>　<b class="bignum">PL${m.need.lv}</b>以上で耐える（火力 <b>${m.need.dps.toFixed(2)}</b> ＝ <b>${rankOf(m.need.dps)}位相当</b>）`
        : `<span class="ng">🛡1発アウト</span>　PL${plMaxOf(m.e)}まで上げても耐えられません`);
    // ゲーム内ではPLが見えないので、必要なぶんを「強化◯回」で示す。
    // PL50超・51超はアメでは届かない(最高の相棒／メガLv4のブースト)ので必ず断っておく
    const way=m.need&&m.need.lv>PL_MAX?'・PL51超はメガLv4のぶん（アメ消費なし）'
      :(m.need&&m.need.lv>PL_NORM?'・PL50超は最高の相棒でのみ到達':'');
    const need=m.hold?'':(m.need
      ? `<span class="plneed">🛡1発耐えまで あと <b class="bignum">${plTimes(m.e.lv,m.need.lv)}回</b> の強化（PL${m.e.lv}→${m.need.lv}${way}）</span>`
      : `<span class="plneed">PL${plMaxOf(m.e)}まで上げてもこのボスのSPアタックは耐えられません${plMaxOf(m.e)<53&&D.pokemon[m.e.key].mega?'（メガLv4を入れるとさらに上げられます）':''}</span>`);
    return `<div class="mine-sum"><span><b>${badges(m.e.shadow,true,m.p)}${m.p.n}</b><small class="msiv">${ivTxt(m.e)}</small></span>${plCtlHtml(m.e,m.i)}<span>${right}</span>${need}<button class="del" data-i="${m.i}" title="この登録を取り消す">✕</button></div>`;
  }).join('')
    +(skipped?`<p class="note">シールド破壊はメガだけなので、登録した${skipped}匹は出していません。</p>`:'')
    // 強いボスほど1発耐えできるメガが減るので、何匹が条件を満たしたのかを必ず出す
    +`<p class="note">🛡1発耐え＋分割SPアタックを持つメガは <b>${rows.length}匹</b>（強いボスほど少なくなります）</p>`
    +`<p class="note expl">ボスがシールドを展開したときにメガシンカポケモンを場に出すと、<b>最初からゲージが50たまった状態</b>になります。分割SPアタック持ちならすぐ撃ってシールドを壊せます</p>`;
  if(!rows.length && !my.length){listEl.innerHTML='<div class="empty">条件(1発耐え+分割SPアタック持ち)を満たすメガシンカが見つかりません</div>';moreBtn.style.display='none';return;}
  const top=Math.max(rows.length?rows[0].dps:1, ...my.map(m=>m.dps));
  // 自分のメガを火力の位置に差し込む
  const merged=[]; const mi=[...my].sort((a,b)=>b.dps-a.dps); let pos=0;
  rows.slice(0,showN).forEach(r=>{
    while(pos<mi.length && mi[pos].dps>=r.dps){merged.push({mine:true,...mi[pos],rank:rankOf(mi[pos].dps)});pos++;}
    merged.push({mine:false,...r,rank:r.rk});
  });
  while(pos<mi.length && showN>=rows.length){merged.push({mine:true,...mi[pos],rank:rankOf(mi[pos].dps)});pos++;}
  listEl.innerHTML=merged.map(r=>{
    if(r.mine){
      const gauge=r.bars>1?`（${r.bars}分割）`:'（1ゲージ・破壊が不安定）';
      const hold=r.hold
        ? `🛡被弾最大${r.maxHit}／HP${r.hp} で1発耐え`
        : `<span class="ng">🛡被弾最大${r.maxHit}／HP${r.hp} で1発アウト</span>${r.need?` → <b class="bignum">PL${r.need.lv}</b>で耐える（火力${r.need.dps.toFixed(2)}）`:` → PL${plMaxOf(r.e)}でも耐えられません`}`;
      return `<div class="rank-row mine"><div class="rk" title="${T_RANKME}">${r.hold?r.rank+'位<br>相当':'PL<br>不足'}</div><div class="rmain">
        <div class="rname">${badges(r.e.shadow,true,r.p)}<span class="nm">${r.p.n}</span>${typeIcons(r.p,16)}<small>${mineLabel(r.e)}（あなた）</small></div>
        <div class="rmoves mvline"><span class="mv">${moveLabel(r.p,r.e.f)}</span>＋<span class="mv">${moveLabel(r.p,r.e.c)}${gauge}</span></div>
        <div class="rmoves holdline">${hold}</div>
        <div class="bar"><i style="width:${Math.min(100,r.dps/top*100).toFixed(1)}%"></i></div></div>
        <div class="rdps" title="${T_DPS}">${r.dps.toFixed(2)}<small>火力(DPS)</small></div></div>`;
    }
    const barsN=Math.round(100/Math.abs(D.moves[r.c.id].e));
    return `
    <div class="rank-row${r.rank<=3?' md'+r.rank:''}"><div class="rk" title="${T_RANK}">${r.rank}位</div><div class="rmain">
      <div class="rname">${badges(false,true,r.p)}<span class="nm">${r.p.n}</span>${typeIcons(r.p,16)}</div>
      <div class="rmoves mvline" title="${T_MOVES_SH}"><span class="mv">${moveLabel(r.p,r.f.id,r.f.sp)}</span>＋<span class="mv">${moveLabel(r.p,r.c.id,r.c.sp)}（${barsN}分割）</span></div>
      <div class="rmoves" title="ボスのいちばん痛いわざ（${r.maxMove.n}）を1発受けたときの最大ダメージです。シールド展開中の1.8倍補正込みで、HPを下回っていれば1発耐えられます">🛡被弾最大${r.maxHit}／HP${r.hp}<span class="expl">（シールド中1.8倍補正込み・${r.maxMove.n}）</span></div>
      <div class="bar"><i style="width:${Math.min(100,r.dps/top*100).toFixed(1)}%"></i></div></div>
      <div class="rdps" title="${T_DPS}">${r.dps.toFixed(2)}<small>火力(DPS)</small></div></div>`;
  }).join('');
  bindMineCtl(sumEl);
  moreBtn.style.display=rows.length>showN?'block':'none';
}
function renderRank(){
  const listEl=document.getElementById('rankList'), sumEl=document.getElementById('mineSummary'), moreBtn=document.getElementById('moreBtn');
  if(shieldMode){renderShieldRank();return;}   // シールド破壊(メガ)
  if(!boss){listEl.innerHTML='<div class="empty">ボスを選ぶとランキングが出ます</div>';sumEl.innerHTML='';moreBtn.style.display='none';return;}
  const rows=buildRanking();
  const top=rows.length?rows[0].dps:1;
  const my=mineRows();
  // 相当順位
  sumEl.innerHTML=my.map(m=>{
    const rank=rankIn(rows,m.dps);
    // シャドウ・メガは文字ではなく名前の左のマークで表す(全ツール共通)
    return `<div class="mine-sum"><span><b>${badges(m.e.shadow,m.p.mega,m.p)}${m.p.n}</b><small class="msiv">${ivTxt(m.e)}</small></span>${plCtlHtml(m.e,m.i)}<span title="${T_RANKME}">火力 <b>${m.dps.toFixed(2)}</b> ＝ <b>${rank}位相当</b></span><button class="del" data-i="${m.i}" title="この登録を取り消す">✕</button></div>`;
  }).join('');
  // 一覧（自分のポケモンを該当位置に挿入）
  const merged=[];
  let mi=[...my].sort((a,b)=>b.dps-a.dps), pos=0;
  rows.slice(0,showN).forEach(r=>{
    while(pos<mi.length && mi[pos].dps>=r.dps){merged.push({mine:true,...mi[pos],rank:rankIn(rows,mi[pos].dps)});pos++;}
    merged.push({mine:false,...r,rank:r.rk});
  });
  while(pos<mi.length && showN>=rows.length){merged.push({mine:true,...mi[pos],rank:rankIn(rows,mi[pos].dps)});pos++;}
  listEl.innerHTML=merged.map(r=>{
    if(r.mine){
      return `<div class="rank-row mine"><div class="rk" title="${T_RANKME}">${r.rank}位<br>相当</div><div class="rmain">
        <div class="rname">${badges(r.e.shadow,r.p.mega,r.p)}<span class="nm">${r.p.n}</span>${typeIcons(r.p,16)}${lowBulk(r.p,r.e.shadow)}<small>${mineLabel(r.e)}（あなた）</small></div>
        <div class="rmoves mvline"><span class="mv">${moveLabel(r.p,r.e.f)}</span>＋<span class="mv">${moveLabel(r.p,r.e.c)}</span></div>
        <div class="bar"><i style="width:${Math.min(100,r.dps/top*100).toFixed(1)}%"></i></div></div>
        <div class="rdps" title="${T_DPS}">${r.dps.toFixed(2)}<small>火力(DPS)</small></div></div>`;
    }
    return `<div class="rank-row${r.rank<=3?' md'+r.rank:''}"><div class="rk" title="${T_RANK}">${r.rank}位</div><div class="rmain">
      <div class="rname">${badges(r.shadow,r.p.mega,r.p)}<span class="nm">${r.p.n}</span>${typeIcons(r.p,16)}${lowBulk(r.p,r.shadow)}<small class="expl" title="${T_PL50}">PL50・個体値15</small></div>
      <div class="rmoves mvline" title="${T_MOVES}"><span class="mv">${moveLabel(r.p,r.f.id,r.f.sp,r.hpTypes)}</span>＋<span class="mv">${moveLabel(r.p,r.c.id,r.c.sp)}</span></div>
      <div class="bar"><i style="width:${(r.dps/top*100).toFixed(1)}%"></i></div></div>
      <div class="rdps" title="${T_DPS}">${r.dps.toFixed(2)}<small>火力(DPS)</small></div></div>`;
  }).join('');
  moreBtn.style.display=rows.length>showN?'block':'none';
  bindMineCtl(sumEl);
}
// ---- 使い方（ページ最下部のタブ）----
// 画面には結論だけを置き、仕様・前提の説明はすべてここへ集める(全ツール共通の方針)
const HELP_HTML = `

    <li>一覧の数字は<b>PL50・個体値15</b>のとき。登録した自分のポケモンだけは、入力したPL・個体値・わざで計算します</li>
    <li><b>火力が同じなら同順位</b>です（攻撃種族値・わざ・タイプ一致が同じだと火力もぴったり同じになります）。同順位が2匹並んだら次は3位、というように<b>重なったぶんの順位は飛ばします</b></li>
  </ul>

  <h4>最低クリア人数（理論値）</h4>
  <ul>
    <li>ボスのHPを、<b>全員がランキング1位のアタッカー</b>（PL50・個体値15・最適わざ）で<b>制限時間いっぱい攻撃し続けた</b>ときに倒しきれる、いちばん少ない人数です</li>
    <li>ランクごとの前提: <b>★1</b>＝HP600・180秒 ／ <b>★3</b>＝HP3600・180秒 ／ <b>★4</b>（メガレイド）＝HP9000・300秒 ／ <b>★5</b>＝HP15000・300秒 ／ <b>★6</b>（メガ伝説・ゲンシカイキ）＝HP22500・300秒 ／ <b>スーパーメガ</b>（スーパーメガレイド）＝HP25000・300秒</li>
    <li>スーパーメガレイドはゲーム内では★の数ではなく<b>シールドの枚数</b>でレベルが表示されます（ここでは1ランクとして扱います）</li>
    <li>ランクはボスから見当を付けて自動で選びます（<b>メガ伝説・ゲンシ</b>→★6、ふつうのメガ→★4、それ以外→★5）。違うランクのときはタップで替えてください</li>
    <li>この計算だけは、ものさし防御100ではなく<b>そのボスの実際の防御（ランクごとの補正込み）</b>でダメージを出し直しています</li>
    <li>倒されて出し直す時間・天候ブースト・フレンドボーナス・メガシンカの応援は入れていません。ブーストがあれば理論値より少なくなることもありますが、<b>実際はこの人数より多めが安全</b>です</li>
    <li><b>スーパーメガレイドは「シールドを壊さない前提」で計算します</b>——最低クリアの少人数ではシールドを壊す頭数がそろわないため。ボスのHPが約80%になるとシールドが張られ、以後は<b>ボスの防御4倍（暫定値）</b>のまま削り切る想定です。倍率は実測で確定したら更新します</li>
  </ul>

  <h4>わざの選ばれ方</h4>
  <ul>
    <li>一覧に出るわざ構成は<b>PL1〜51の全レベルで計算して、いちばん多くのレベルで1位だった組み合わせ</b>です</li>
    <li>1位が<b>ゲージ分割なし（1ゲージ）</b>のわざでも、分割ありとの差が<b>7%未満</b>なら分割ありを優先します（実戦では撃ちやすいため）</li>
    <li><b>(特)</b>は特別わざ・レガシーわざ（イベント限定やすごいわざマシンスペシャルなどで習得）。習得済みならそのまま選べます</li>
    <li><b>めざめるパワー</b>はタイプを選べないので、そのボスに刺さるタイプをアイコンで示します</li>

  <h4>自分のポケモンの登録</h4>
  <ul>

    <li><b>強化 +0.5</b>＝1回の強化ぶんPLが上がります。ゲーム内ではPLが見えないので、<b>強化の回数</b>で数えられるようにしています（<b>−</b>で1回戻す・<b>↩</b>で入力したPLに戻る）</li>

(() => {
  const tab = document.getElementById('helptab'), body = document.getElementById('helpbody');
  tab.onclick = () => {
    const open = body.style.display === 'none';
    if (open && !body.innerHTML) body.innerHTML = HELP_HTML;
    body.style.display = open ? 'block' : 'none';
    tab.setAttribute('aria-expanded', open);
    tab.textContent = open ? '？ 使い方・計算の前提（閉じる）' : '？ 使い方・計算の前提';
  };
})();
