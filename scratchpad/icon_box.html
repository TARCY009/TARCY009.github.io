<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<!-- ボックス割引率チェッカーのアイコン(2026-11-12): 濃紺〜すみれの地(金と水色のほのかな光)に、画面と同じ箱の絵(赤に花)。
     画面なしブラウザで 512x512 を撮り、scratchpad/icon_box.py が四隅を落として4サイズに書き出す -->
<style>
html,body{margin:0;width:512px;height:512px;overflow:hidden;background:transparent}
.bg{position:absolute;inset:0;background:
  radial-gradient(300px 260px at 22% 18%, rgba(255,201,60,.34), transparent 70%),
  radial-gradient(320px 280px at 88% 92%, rgba(34,195,230,.26), transparent 70%),
  linear-gradient(150deg,#26305e,#141a3a 55%,#1d1233)}
.bx{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%)}
.bx svg{display:block;width:430px;height:auto;filter:drop-shadow(0 18px 22px rgba(0,0,0,.45))}
</style></head><body>
<div class="bg"></div><div class="bx" id="bx"></div>
<script src="/box/giftbox.js"></script>
<script>document.getElementById('bx').innerHTML = GiftBox.svg('legend', {size: 430});</script>
</body></html>
