# 毎日 日本時間 朝6時に最新データをチェックし、変更があれば
# Pull Request（承認待ち）を作成してお知らせします。
# → 通知が届いたら内容を確認し「Merge」を押した時だけサイトに反映されます。
#
# 2026-08-09拡張: 火力チェッカーだけでなく全ツールのデータを一括更新する。
#   build_data.py            → index.html / godata.json（火力チェッカー）
#   gym-attack/build_gym.py  → gym_data.json/js（ジム挑戦。godata.jsonから同期）
#   gym-defense/build_defense.py → defense_data.js/json（ジム防衛）
#   max-battle/build_max.py  → max_data.js（マックスバトル）
#   build_pvp_data.py        → pvp_data.js/json（GBL対面シミュ・ロケット団対策）
name: auto-update-check

on:
  schedule:
    - cron: '0 21 * * *'   # UTC 21:00 = JST 6:00 毎日
  workflow_dispatch:        # Actionsタブから手動実行も可能

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 火力チェッカーをビルド（差分サマリーも生成）
        run: python3 build_data.py

      - name: ジム挑戦データを同期
        run: python3 gym-attack/build_gym.py

      - name: ジム防衛データを再計算
        run: python3 gym-defense/build_defense.py

      - name: マックスバトルデータを再生成
        run: python3 max-battle/build_max.py

      - name: GBL・ロケット団対策データを再生成
        run: python3 build_pvp_data.py

      # わざの追加や削除で確定値がずれることがあるので、環境上位のわざ構成も作り直す
      # （報告は changes.md にまとまるので、ここでは meta_changes.md を書き換えない）
      - name: 環境上位のわざ構成を作り直す
        run: python3 pvp-tests/build_meta_moves.py --no-report

      - name: 変更があればPull Requestを作成（承認待ち）
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto-update          # 常に同じブランチを使い回す（PRが乱立しない）
          add-paths: |
            index.html
            godata.json
            gym-attack/data/gym_data.json
            gym-attack/data/gym_data.js
            gym-defense/data/defense_data.js
            gym-defense/data/defense_data.json
            max-battle/data/max_data.js
            pvp_data.js
            pvp_data.json
            assets/meta_moves.js
          title: "📢 データ更新があります：反映しますか？"
          body-path: changes.md        # 変更内容の日本語サマリー
          commit-message: "自動データ更新"
          delete-branch: true          # Merge/Close後にブランチ自動削除
