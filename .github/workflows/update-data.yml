# 毎日 日本時間 朝6時に最新データをチェックし、変更があれば
# そのままサイトに反映します（2026-08-12にタダシさんの指示で、承認待ちPRから完全自動へ変更）。
# → 反映した内容は「お知らせ」を立てて知らせるので、GitHubからメールが届きます。
#   タダシさん側の操作は不要。読むだけ。
#
# 2026-08-09拡張: 火力チェッカーだけでなく全ツールのデータを一括更新する。
#   build_data.py            → dps/index.html / godata.json（レイド火力チェッカー）
#   gym-attack/build_gym.py  → gym_data.json/js（ジム挑戦。godata.jsonから同期）
#   gym-defense/build_defense.py → defense_data.js/json（ジム防衛）
#   max-battle/build_max.py  → max_data.js（マックスバトル）
#   build_pvp_data.py        → pvp_data.js/json（GBL対面シミュ・ロケット団対策）
#   iv-checker/build_iv.py   → iv-checker/index.html（個体値チェッカー。pvp_data.jsonから同期）
name: auto-update-check

on:
  schedule:
    - cron: '0 21 * * *'   # UTC 21:00 = JST 6:00 毎日
    # シーズンの切り替わり(3か月ごと)は日本時間10:00に大型のわざアップデートが入る。
    # 朝6時の回だけだと丸1日ぶん古い性能で計算してしまうので、昼にもう1回見に行く。
    # 変化が無い日は何もしない(コミットもお知らせも出ない)ので、増えるのは実行だけ
    - cron: '0 2 * * *'    # UTC 2:00 = JST 11:00 毎日
  workflow_dispatch:        # Actionsタブから手動実行も可能

permissions:
  contents: write
  issues: write     # 更新内容の「お知らせ」を立てる（GitHubがそれをメールで送ってくれる）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 火力チェッカーをビルド（差分サマリーも生成）
        id: build
        run: |
          python3 build_data.py | tee /tmp/build.txt
          echo "headline=$(grep '^HEADLINE: ' /tmp/build.txt | sed 's/^HEADLINE: //')" >> "$GITHUB_OUTPUT"

      - name: ジム挑戦データを同期
        run: python3 gym-attack/build_gym.py

      - name: ジム防衛データを再計算
        run: python3 gym-defense/build_defense.py

      - name: マックスバトルデータを再生成
        run: python3 max-battle/build_max.py

      - name: GBL・ロケット団対策データを再生成
        run: python3 build_pvp_data.py

      # 個体値チェッカーだけ手作業更新でメガ4匹が取り残されていたため、2026-08-15に同期を追加した
      - name: 個体値チェッカーのポケモンを同期
        run: python3 iv-checker/build_iv.py

      # わざの追加や削除で確定値がずれることがあるので、環境上位のわざ構成も作り直す
      # （報告は changes.md にまとまるので、ここでは meta_changes.md を書き換えない）
      - name: 環境上位のわざ構成を作り直す
        run: python3 pvp-tests/build_meta_moves.py --no-report

      - name: 更新内容を実行結果ページに表示
        run: cat changes.md >> "$GITHUB_STEP_SUMMARY"

      - name: 変更があればそのまま公開
        id: commit
        env:
          HEADLINE: ${{ steps.build.outputs.headline }}
        run: |
          FILES="dps/index.html godata.json
                 gym-attack/data/gym_data.json gym-attack/data/gym_data.js
                 gym-defense/data/defense_data.js gym-defense/data/defense_data.json
                 max-battle/data/max_data.js
                 pvp_data.js pvp_data.json assets/meta_moves.js
                 iv-checker/index.html"
          if git diff --quiet -- $FILES; then
            echo "データに変化なし。今回は更新しない"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore: ゲームデータを自動更新（${HEADLINE:-内部データの調整のみ}）" \
                       -m "変更の内訳はお知らせ（Issue）を見てください。"
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      # 更新があった日だけ「お知らせ」を立てる。GitHubがこれをメールで送ってくれる。
      # 前回のお知らせは自動で閉じて受信箱をためない。
      - name: 更新内容をお知らせする
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEADLINE: ${{ steps.build.outputs.headline }}
        run: |
          gh issue list --state open --limit 50 --json number,title \
            | jq -r '.[] | select(.title | startswith("📢 ゲームデータの更新内容")) | .number' \
            | xargs -r -I{} gh issue close {} --comment "新しいお知らせが届いたので閉じます。"
          {
            cat changes.md
            echo ""
            echo "@${{ github.repository_owner }}"
          } > /tmp/issue_body.md
          gh issue create \
            --title "📢 ゲームデータの更新内容（$(TZ=Asia/Tokyo date '+%-m/%-d')）${HEADLINE:-内部データの調整のみ}" \
            --body-file /tmp/issue_body.md
