# GBL環境上位リスト(assets/meta_lists.js)と、そのわざ構成(assets/meta_moves.js)の自動更新
# 毎週月曜 日本時間 朝9時にランキングを取得し、変化があればそのままサイトに反映する（承認不要の完全自動）。
#
# 入れ替わりで入ってきた新顔のわざ構成も自動で決まる（build_meta_moves.py が
# 「人の確定値 → 同リーグの通常⇄シャドウの引き継ぎ → 情報元の推奨」の順に埋める）ので、
# 手作業は不要。どれがどう変わったかは pvp-tests/meta_changes.md と
# コミットメッセージ・Actionsの実行結果ページに出る。
name: auto-update-meta

on:
  schedule:
    - cron: '0 0 * * 1'   # UTC 0:00 月曜 = JST 9:00 月曜
  workflow_dispatch:        # Actionsタブから手動実行も可能
    inputs:
      test:
        description: 'お知らせが届くかテストする（環境に変化が無くてもお知らせを立てる）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write     # 更新結果の「お知らせ」を立てる（GitHubがそれをメールで送ってくれる）

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 環境上位リストを再生成
        run: python3 build_meta.py

      - name: わざ構成の確定値を再生成し、更新結果をまとめる
        id: moves
        run: |
          python3 pvp-tests/build_meta_moves.py | tee /tmp/out.txt
          echo "headline=$(grep '^HEADLINE: ' /tmp/out.txt | sed 's/^HEADLINE: //')" >> "$GITHUB_OUTPUT"

      - name: 更新結果を実行結果ページに表示
        run: cat pvp-tests/meta_changes.md >> "$GITHUB_STEP_SUMMARY"

      - name: 変化があればコミットして公開
        id: commit
        env:
          HEADLINE: ${{ steps.moves.outputs.headline }}
        run: |
          if git diff --quiet assets/meta_lists.js assets/meta_moves.js; then
            echo "環境に変化なし。今回は更新しない"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/meta_lists.js assets/meta_moves.js pvp-tests/meta_changes.md
            git commit -m "chore: GBL環境上位リストとわざ構成を自動更新（${HEADLINE}）" \
                       -m "変更の内訳は pvp-tests/meta_changes.md を見てください。"
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      # 更新があった週だけ「お知らせ」を立てる。GitHubがこれをメールで送ってくれるので
      # タダシさん側の設定は不要。先週までのお知らせは自動で閉じて受信箱をためない。
      - name: 更新結果をお知らせする
        if: steps.commit.outputs.changed == '1' || github.event.inputs.test == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEADLINE: ${{ steps.moves.outputs.headline }}
          OWNER: ${{ github.repository_owner }}
          IS_TEST: ${{ github.event.inputs.test }}
        run: |
          if [ "$IS_TEST" = "true" ] && [ "${{ steps.commit.outputs.changed }}" != "1" ]; then
            HEADLINE="テスト送信（環境に変化はありません）"
          fi
          gh issue list --state open --limit 50 --json number,title \
            | jq -r '.[] | select(.title | startswith("📢 環境リストの更新結果")) | .number' \
            | xargs -r -I{} gh issue close {} --comment "新しいお知らせが届いたので閉じます。"
          {
            cat pvp-tests/meta_changes.md
            echo
            echo "---"
            echo "この内容はすでにサイトへ反映済みです。読み終わったらこのお知らせを閉じてください。"
            echo "（次の更新のときに自動で閉じるので、そのままでも大丈夫です）"
            echo ""
            echo "@${OWNER}"
          } > /tmp/issue_body.md
          gh issue create \
            --title "📢 環境リストの更新結果（$(TZ=Asia/Tokyo date '+%-m/%-d')）${HEADLINE}" \
            --body-file /tmp/issue_body.md
