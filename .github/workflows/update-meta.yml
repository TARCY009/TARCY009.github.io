# GBL環境上位リスト(assets/meta_lists.js)の自動更新
# 毎週月曜 日本時間 朝9時にPvPokeのランキングを取得し、
# 変化があればそのままサイトに反映する（承認不要の完全自動）。
name: auto-update-meta

on:
  schedule:
    - cron: '0 0 * * 1'   # UTC 0:00 月曜 = JST 9:00 月曜
  workflow_dispatch:        # Actionsタブから手動実行も可能

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 環境上位リストを再生成
        run: python3 build_meta.py

      - name: 変化があればコミットして公開
        run: |
          if git diff --quiet assets/meta_lists.js; then
            echo "環境に変化なし。今回は更新しない"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/meta_lists.js
            git commit -m "chore: GBL環境上位リストを自動更新 (PvPoke)"
            git push
          fi
