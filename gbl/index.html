<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOバトルリーグ対面シミュレーター</title>
<meta name="description" content="ポケモンGOのGOバトルリーグ(GBL)対面を1ターン単位で正確にシミュレート。理想個体値・技構成・シールド枚数・発動タイミングを自動最適化。">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/gbl/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/gbl/apple-touch-icon.png">
<link rel="manifest" href="/gbl/manifest.webmanifest">
<link rel="stylesheet" href="/assets/shadow-icon.css">
<link rel="stylesheet" href="/assets/gbl.css">
<link rel="stylesheet" href="/assets/theme.css">
<meta name="theme-color" content="#0c1122">
<!-- 保存してあるテーマを、画面を描く前に当てる(あとから当てるとダークが一瞬光る) -->
<script>try{if(localStorage.getItem('site_theme')==='light')document.documentElement.className='light';}catch(e){}</script>
<script>
// ロケット団戦は専用ページ(/rocket/)へ独立した。古い共有リンク(md=rocket)は設定ごと転送する
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('md') === 'rocket') {
    q.delete('md');
    const qs = q.toString();
    location.replace('/rocket/' + (qs ? '?' + qs : ''));
  }
})();
</script>
</head>
<body>
<div id="app"></div>
<script src="/pvp_data.js"></script>

<script src="/assets/meta_moves.js"></script>
<script src="/assets/type-icons.js"></script>
<script src="/assets/pvp-engine.js"></script>
<script src="/assets/rocket_roster.js"></script>
<script src="/assets/gbl-app.js"></script>
<script src="/assets/theme.js"></script>
</body>
</html>
