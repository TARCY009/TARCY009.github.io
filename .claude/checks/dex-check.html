<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>ステータス図鑑の答え合わせ</title></head>
<body>
<div id="out">実行中…</div>
<iframe id="f" src="/pokedex/index.html" style="width:420px;height:300px"></iframe>
<script>
// ステータス図鑑の本物の画面（pick で選んだあとのヒーローカード・タイプ相性・わざ表）を読み、確認済みの数値と照らし合わせる。
// 答えの出どころ（本体の関数は使っていない）:
//  ・マリルリ SL1818／HL2084、メルメタル マスター4054、ジガルデ スーパー「—」＝ .claude/rules/dex.md の検証済みの値
//  ・はなふぶき DPE 2.03 ＝ タダシさん提供のスクショ（dex.md）
//  ・最大CP・メガLv4のCP・そのほかのSCP ＝ 図鑑とは別に Python で総当たりした値（2026-09-25）
//  ・タイプ相性 ＝ ゲーム内の相性表からの手計算（ドラゴン/ひこう・はがね/エスパー）
//  ・げきりん+ ＝ 185×1.3（メガLv4）×1.2（タイプ一致）＝288.6
// 答えを変えるときは必ずタダシさんに確認すること。
const f = document.getElementById('f');
const out = document.getElementById('out');
const sleep = ms => new Promise(r => setTimeout(r, ms));
f.onload = async () => {
  const res = [];
  const ok = (name, got, want) => res.push([name, String(got) === String(want), got, want]);
  try {
    const W = f.contentWindow, doc = f.contentDocument;
    for (let i = 0; i < 200 && !(W.eval('DEX.length') > 0); i++) await sleep(50);
    if (!(W.eval('DEX.length') > 0)) throw new Error('図鑑のデータが読み込まれませんでした');
    const show = nm => { W.eval(`state.tab='pve'`); W.pick(nm); return doc.getElementById('herocard'); };
    const txt = (el, sel) => { const x = el.querySelector(sel); return x ? x.textContent.trim() : '(なし)'; };
    // ① 最大CP・メガLv4・最大SCP（3リーグ）
    const HERO = [
      ['ミュウツー', '4724', null, '1326', '2219', '4136'],
      ['マリルリ', '1795', null, '1818', '2084', '2084'],
      ['メルメタル', '4069', null, '1522', '2538', '4054'],
      ['フシギバナ', '3075', null, '1508', '2519', '3031'],
      ['ジガルデ', null, null, '—', '2629', '4032'],
      ['メガレックウザ', '6458', '6613', null, null, null],
      ['メガカイリュー', '5452', '5583', null, null, null],
    ];
    for (const [nm, cp, cp52, sl, hl, ml] of HERO) {
      const h = show(nm);
      if (!h || !h.textContent.includes(nm)) { res.push([`${nm} を開けない`, false, '(なし)', nm]); continue; }
      if (cp) ok(`${nm} 最大CP`, txt(h, '.cp>b'), cp);
      if (cp52) ok(`${nm} メガLv4のCP`, txt(h, '.mega4 i'), cp52);
      if (sl) ok(`${nm} 最大SCP スーパー／ハイパー／マスター`,
        [txt(h, '.scps .sl b'), txt(h, '.scps .hl b'), txt(h, '.scps .ml b')].join('／'), [sl, hl, ml].join('／'));
    }
    // ② タイプ相性（受けるダメージ）。並びは見ずに、倍率ごとのタイプの顔ぶれで比べる
    const effOf = h => {
      const r = {};
      h.querySelectorAll('.effrow').forEach(row => {
        const m = row.querySelector('.mult').textContent.trim();
        r[m] = [...row.querySelectorAll('.tps [aria-label]')].map(x => x.getAttribute('aria-label')).sort().join('・');
      });
      return Object.keys(r).sort().map(k => `${k}:${r[k]}`).join(' ');
    };
    const EFF = [
      ['ボーマンダ', { '×2.56': ['こおり'], '×1.6': ['いわ', 'ドラゴン', 'フェアリー'], '×0.39': ['くさ', 'じめん'], '×0.63': ['かくとう', 'ほのお', 'みず', 'むし'] }],
      ['メタグロス', { '×1.6': ['あく', 'じめん', 'ゴースト', 'ほのお'], '×0.39': ['どく', 'エスパー'],
        '×0.63': ['いわ', 'くさ', 'こおり', 'ドラゴン', 'ノーマル', 'はがね', 'ひこう', 'フェアリー'] }],
    ];
    for (const [nm, want] of EFF) {
      const w = Object.keys(want).sort().map(k => `${k}:${want[k].slice().sort().join('・')}`).join(' ');
      ok(`${nm} のタイプ相性`, effOf(show(nm)), w);
    }
    // ③ わざ表（ジム・レイド＝＋わざの威力／トレーナーバトル＝DPE）
    show('メガカイリュー');
    const cell = (id, i) => { const tr = doc.querySelector(`#mvcard tr[data-mv="${id}"]`); return tr ? tr.children[i].textContent.trim() : '(行なし)'; };
    ok('メガカイリュー げきりん+ の威力（メガLv4・タイプ一致）', cell('OUTRAGE_PLUS', 1), '288.6');
    show('フシギバナ');
    doc.querySelector('#mvcard .mtabs button[data-t="pvp"]').click();
    await sleep(50);
    ok('フシギバナ はなふぶき のDPE（トレーナーバトル）', cell('PETAL_BLIZZARD', 3), '2.03');
  } catch (e) {
    res.push(['実行エラー', false, String(e), '']);
  }
  const bad = res.filter(r => !r[1]).length;
  out.innerHTML = res.map(([n, g, got, want]) => `<div>${g ? '✅' : '❌'} ${n}: ${got}${g ? '' : '（答え ' + want + '）'}</div>`).join('')
    + `<div id="sum" data-ok="${res.length - bad}" data-ng="${bad}">合計 ${res.length - bad}/${res.length}</div>`;
};
</script>
</body></html>
